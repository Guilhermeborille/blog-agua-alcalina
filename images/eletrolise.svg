<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="t">
  <title id="t">Ionizador de água por eletrólise: cátodo produz OH⁻ e H₂, ânodo produz H⁺ e O₂</title>
  <rect width="760" height="410" rx="20" fill="#f3f9fc"/>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#12303b">
    <!-- água -->
    <path d="M204 190 L556 190 L556 330 Q556 346 540 346 L220 346 Q204 346 204 330 Z" fill="#bfe3f5" opacity=".9"/>
    <path d="M200 130 L200 330 Q200 350 220 350 L540 350 Q560 350 560 330 L560 130" fill="none" stroke="#12303b" stroke-width="4" stroke-linejoin="round"/>
    <!-- membrana -->
    <line x1="380" y1="190" x2="380" y2="346" stroke="#12303b" stroke-width="3" stroke-dasharray="7 6"/>
    <!-- eletrodos -->
    <rect x="270" y="100" width="16" height="210" rx="3" fill="#9aa7ad" stroke="#12303b" stroke-width="3"/>
    <rect x="474" y="100" width="16" height="210" rx="3" fill="#9aa7ad" stroke="#12303b" stroke-width="3"/>
    <!-- fios e fonte -->
    <g fill="none" stroke="#12303b" stroke-width="3" stroke-linejoin="round">
      <path d="M278 100 L278 60 L330 60"/>
      <path d="M482 100 L482 60 L430 60"/>
    </g>
    <rect x="330" y="40" width="100" height="40" rx="6" fill="#fff" stroke="#12303b" stroke-width="3"/>
    <text x="347" y="67" font-size="22" font-weight="700" text-anchor="middle">−</text>
    <text x="380" y="65" font-size="13" text-anchor="middle">fonte</text>
    <text x="413" y="67" font-size="22" font-weight="700" text-anchor="middle">+</text>
    <text x="262" y="118" font-size="15" font-weight="700" text-anchor="end">Cátodo (−)</text>
    <text x="498" y="118" font-size="15" font-weight="700">Ânodo (+)</text>
    <!-- bolhas -->
    <g fill="none" stroke="#fff" stroke-width="3">
      <circle cx="254" cy="230" r="7"/><circle cx="244" cy="270" r="5"/><circle cx="300" cy="210" r="6"/>
      <circle cx="510" cy="240" r="7"/><circle cx="520" cy="285" r="5"/><circle cx="462" cy="215" r="6"/>
    </g>
    <text x="335" y="262" font-size="14" font-weight="700" fill="#2f6fb5" text-anchor="middle">OH⁻ (básica)</text>
    <text x="428" y="262" font-size="14" font-weight="700" fill="#e4572e" text-anchor="middle">H⁺ (ácida)</text>
    <!-- reações -->
    <text x="20" y="378" font-size="15" font-weight="700" fill="#2f6fb5">Cátodo: 2 H₂O + 2 e⁻ → H₂ + 2 OH⁻</text>
    <text x="20" y="398" font-size="13">lado que vira a “água alcalina”</text>
    <text x="420" y="378" font-size="15" font-weight="700" fill="#e4572e">Ânodo: 2 H₂O → O₂ + 4 H⁺ + 4 e⁻</text>
    <text x="420" y="398" font-size="13">lado ácido (geralmente descartado)</text>
  </g>
</svg>
