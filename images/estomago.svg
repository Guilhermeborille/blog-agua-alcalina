<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t">
  <title id="t">Água alcalina chegando ao estômago, onde encontra suco gástrico ácido e é neutralizada</title>
  <rect width="760" height="380" rx="20" fill="#fff5f0"/>
  <path d="M127 6 C139 22 146 30 127 42 C108 30 115 22 127 6 Z" fill="#7fc3e8" stroke="#2f6fb5" stroke-width="3"/>
  <g transform="translate(0 30)">
    <rect x="110" y="20" width="34" height="60" rx="6" fill="#f4b6a6" stroke="#c4573f" stroke-width="4"/>
    <path d="M110 70 C110 110 90 150 100 200 C112 270 180 320 270 318 C350 316 380 270 360 230 C345 200 300 205 260 190 C215 172 190 150 160 120 C146 104 146 90 144 70 Z" fill="#f6c3b4" stroke="#c4573f" stroke-width="4" stroke-linejoin="round"/>
    <g fill="#e4572e">
      <circle cx="125" cy="160" r="6"/><circle cx="150" cy="205" r="6"/><circle cx="190" cy="240" r="6"/><circle cx="232" cy="272" r="6"/>
      <circle cx="285" cy="285" r="6"/><circle cx="322" cy="250" r="6"/><circle cx="250" cy="228" r="6"/><circle cx="172" cy="170" r="6"/>
      <circle cx="205" cy="205" r="6"/><circle cx="300" cy="228" r="6"/>
    </g>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif">
    <text x="230" y="372" text-anchor="middle" font-size="14" fill="#53666d">estômago (cada ponto vermelho = H⁺)</text>
    <text x="410" y="70" font-size="17" font-weight="700" fill="#2f6fb5">1  Água “alcalina” (pH ≈ 9)</text>
    <text x="410" y="92" font-size="14" fill="#53666d">é bebida e chega ao estômago</text>
    <text x="410" y="160" font-size="17" font-weight="700" fill="#e4572e">2  Encontra o suco gástrico</text>
    <text x="410" y="182" font-size="14" fill="#53666d">ácido clorídrico, pH ≈ 1,5–3,5</text>
    <text x="410" y="250" font-size="17" font-weight="700" fill="#1b7f79">3  É neutralizada em instantes</text>
    <text x="410" y="272" font-size="14" fill="#53666d">e o estômago volta à acidez normal</text>
  </g>
</svg>
