<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="t">
  <title id="t">Tampão bicarbonato do sangue: CO₂ e água, ácido carbônico, H⁺ e bicarbonato, regulados por pulmões e rins</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#12303b"/></marker>
  </defs>
  <rect width="800" height="390" rx="20" fill="#f3f9fc"/>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#12303b" text-anchor="middle">
    <rect x="40" y="160" width="200" height="70" rx="16" fill="#e8f4fb" stroke="#2f6fb5" stroke-width="3"/>
    <text x="140" y="204" font-size="22" font-weight="700">CO₂ + H₂O</text>
    <rect x="300" y="160" width="200" height="70" rx="16" fill="#fff6c9" stroke="#d9b61c" stroke-width="3"/>
    <text x="400" y="204" font-size="22" font-weight="700">H₂CO₃</text>
    <text x="400" y="252" font-size="13">ácido carbônico</text>
    <rect x="560" y="160" width="200" height="70" rx="16" fill="#fde0d6" stroke="#e4572e" stroke-width="3"/>
    <text x="660" y="204" font-size="22" font-weight="700">H⁺ + HCO₃⁻</text>
    <text x="270" y="209" font-size="34">⇌</text>
    <text x="530" y="209" font-size="34">⇌</text>
    <!-- enzima -->
    <rect x="325" y="104" width="150" height="30" rx="15" fill="#fff" stroke="#12303b" stroke-width="2"/>
    <text x="400" y="124" font-size="13" font-weight="700">anidrase carbônica</text>
    <line x1="400" y1="136" x2="400" y2="156" stroke="#12303b" stroke-width="3" marker-end="url(#ar)"/>
    <!-- pulmões -->
    <line x1="140" y1="156" x2="140" y2="82" stroke="#12303b" stroke-width="3" marker-end="url(#ar)"/>
    <text x="140" y="40" font-size="16" font-weight="700">Pulmões</text>
    <text x="140" y="60" font-size="14">eliminam CO₂ ao respirar</text>
    <!-- rins -->
    <line x1="660" y1="234" x2="660" y2="310" stroke="#12303b" stroke-width="3" marker-end="url(#ar)"/>
    <text x="660" y="338" font-size="16" font-weight="700">Rins</text>
    <text x="660" y="358" font-size="14">reabsorvem HCO₃⁻ e excretam H⁺</text>
    <!-- fórmula -->
    <text x="40" y="326" text-anchor="start" font-size="17" font-weight="700">pH = 6,1 + log ( [HCO₃⁻] / (0,03 × pCO₂) )</text>
    <text x="40" y="352" text-anchor="start" font-size="14">normal: 24 mEq/L e 40 mmHg → pH ≈ 7,40</text>
  </g>
</svg>
