<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="t">
  <title id="t">Escala de pH de 0 a 14 com exemplos do dia a dia</title>
  <rect width="900" height="250" rx="20" fill="#ffffff"/>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif">
    <!-- barra -->
    <rect x="30" y="100" width="56" height="50" fill="#d7263d"/>
    <rect x="86" y="100" width="56" height="50" fill="#e8453c"/>
    <rect x="142" y="100" width="56" height="50" fill="#ef6a3a"/>
    <rect x="198" y="100" width="56" height="50" fill="#f58f3b"/>
    <rect x="254" y="100" width="56" height="50" fill="#f7b13c"/>
    <rect x="310" y="100" width="56" height="50" fill="#f4d13f"/>
    <rect x="366" y="100" width="56" height="50" fill="#cfe04a"/>
    <rect x="422" y="100" width="56" height="50" fill="#7fc97f"/>
    <rect x="478" y="100" width="56" height="50" fill="#4fb8a4"/>
    <rect x="534" y="100" width="56" height="50" fill="#3aa0c0"/>
    <rect x="590" y="100" width="56" height="50" fill="#3b82c4"/>
    <rect x="646" y="100" width="56" height="50" fill="#4a64b8"/>
    <rect x="702" y="100" width="56" height="50" fill="#5a4ca8"/>
    <rect x="758" y="100" width="56" height="50" fill="#6b3e98"/>
    <rect x="814" y="100" width="56" height="50" fill="#7a2f88"/>
    <g font-size="20" font-weight="700" text-anchor="middle">
      <text x="58" y="133" fill="#fff">0</text><text x="114" y="133" fill="#fff">1</text><text x="170" y="133" fill="#fff">2</text>
      <text x="226" y="133" fill="#12303b">3</text><text x="282" y="133" fill="#12303b">4</text><text x="338" y="133" fill="#12303b">5</text>
      <text x="394" y="133" fill="#12303b">6</text><text x="450" y="133" fill="#12303b">7</text><text x="506" y="133" fill="#12303b">8</text>
      <text x="562" y="133" fill="#fff">9</text><text x="618" y="133" fill="#fff">10</text><text x="674" y="133" fill="#fff">11</text>
      <text x="730" y="133" fill="#fff">12</text><text x="786" y="133" fill="#fff">13</text><text x="842" y="133" fill="#fff">14</text>
    </g>
    <!-- marcadores acima -->
    <g stroke="#12303b" stroke-width="2"><line x1="198" y1="76" x2="198" y2="100"/><line x1="338" y1="76" x2="338" y2="100"/><line x1="472" y1="76" x2="472" y2="100"/><line x1="562" y1="76" x2="562" y2="100"/><line x1="758" y1="76" x2="758" y2="100"/></g>
    <g fill="#12303b" text-anchor="middle">
      <text x="198" y="50" font-size="14" font-weight="700">Suco gástrico</text><text x="198" y="68" font-size="13">≈ 1,5–3,5</text>
      <text x="338" y="50" font-size="14" font-weight="700">Café</text><text x="338" y="68" font-size="13">≈ 5</text>
      <text x="472" y="50" font-size="14" font-weight="700">Sangue</text><text x="472" y="68" font-size="13">7,35–7,45</text>
      <text x="562" y="50" font-size="14" font-weight="700">Água “alcalina”</text><text x="562" y="68" font-size="13">≈ 9</text>
      <text x="758" y="50" font-size="14" font-weight="700">Água sanitária</text><text x="758" y="68" font-size="13">≈ 12,5</text>
    </g>
    <!-- marcadores abaixo -->
    <g stroke="#12303b" stroke-width="2"><line x1="181" y1="150" x2="181" y2="166"/><line x1="450" y1="150" x2="450" y2="166"/><line x1="512" y1="150" x2="512" y2="166"/><line x1="674" y1="150" x2="674" y2="166"/></g>
    <g fill="#12303b" text-anchor="middle">
      <text x="181" y="183" font-size="14" font-weight="700">Limão</text><text x="181" y="200" font-size="13">≈ 2–2,6</text>
      <text x="450" y="183" font-size="14" font-weight="700">Água pura</text><text x="450" y="200" font-size="13">7 (a 25 °C)</text>
      <text x="514" y="183" font-size="14" font-weight="700">Mar</text><text x="514" y="200" font-size="13">≈ 8,1</text>
      <text x="674" y="183" font-size="14" font-weight="700">Amônia</text><text x="674" y="200" font-size="13">≈ 11</text>
    </g>
    <!-- legenda -->
    <g font-size="14" font-weight="700">
      <text x="30" y="234" fill="#d7263d">◀ mais ácido (mais H⁺)</text>
      <text x="450" y="234" fill="#2e8b57" text-anchor="middle">neutro</text>
      <text x="870" y="234" fill="#4a64b8" text-anchor="end">mais básico / alcalino (mais OH⁻) ▶</text>
    </g>
  </g>
</svg>
